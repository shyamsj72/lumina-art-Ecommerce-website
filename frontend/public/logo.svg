<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&amp;display=swap');
      .lumina-text {
        font-family: 'Quicksand', 'Comfortaa', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 76px;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <g transform="translate(10, 86)">
    <!-- L (Blue) -->
    <text x="0" y="0" class="lumina-text" fill="#1A73E8">L</text>
    
    <!-- u (Red) -->
    <text x="44" y="0" class="lumina-text" fill="#EA4335">u</text>
    
    <!-- m (Yellow) -->
    <text x="96" y="0" class="lumina-text" fill="#FBBC05">m</text>
    
    <!-- i (Blue with circular dot) -->
    <text x="174" y="0" class="lumina-text" fill="#1A73E8">i</text>
    
    <!-- n (Green) -->
    <text x="198" y="0" class="lumina-text" fill="#34A853">n</text>
    
    <!-- a (Red) -->
    <text x="250" y="0" class="lumina-text" fill="#EA4335">a</text>

    <!-- Stylized Chevron 'A' without crossbar (Blue) -->
    <g transform="translate(320, -56)">
      <path d="M 5 56 L 25 8 L 45 56" stroke="#1A73E8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- r (Green) -->
    <text x="382" y="0" class="lumina-text" fill="#34A853">r</text>

    <!-- t (Yellow) -->
    <text x="418" y="0" class="lumina-text" fill="#FBBC05">t</text>

    <!-- . (Red Dot) -->
    <circle cx="456" cy="-10" r="7.5" fill="#EA4335" />
  </g>
</svg>
